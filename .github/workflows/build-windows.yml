name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LiveTranslator.csproj

      - name: Publish Windows portable folder
        run: >
          dotnet publish LiveTranslator.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:PublishTrimmed=false
          -o publish

      - name: Show runtime files
        shell: pwsh
        run: |
          Write-Host "Published files:"
          Get-ChildItem -Recurse publish | Select-Object FullName
          Write-Host "Whisper native candidates:"
          Get-ChildItem -Recurse publish | Where-Object {
            $_.Name -match 'whisper|ggml' -or $_.FullName -match 'runtimes'
          } | Select-Object FullName

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslator-LocalAI-Portable
          path: publish/**
          if-no-files-found: error

name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LiveTranslator.csproj

      - name: Publish single-file Windows EXE
        run: >
          dotnet publish LiveTranslator.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslator-Windows-x64
          path: publish/**
          if-no-files-found: error

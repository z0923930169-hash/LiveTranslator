name: Build and Verify Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      LIVETRANSLATOR_MODEL_DIR: ${{ github.workspace }}\.ci-models

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LiveTranslator.csproj

      - name: Publish Windows portable folder
        run: >
          dotnet publish LiveTranslator.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:PublishTrimmed=false
          -o publish

      - name: Verify required native files exist
        shell: pwsh
        run: |
          $required = @(
            "publish\runtimes\win-x64\ggml-base-whisper.dll",
            "publish\runtimes\win-x64\ggml-cpu-whisper.dll",
            "publish\runtimes\win-x64\ggml-whisper.dll",
            "publish\runtimes\win-x64\whisper.dll",
            "publish\runtimes\win-x64\native\avx2\ggml-base.dll",
            "publish\runtimes\win-x64\native\avx2\ggml.dll",
            "publish\runtimes\win-x64\native\avx2\ggml-cpu.dll",
            "publish\runtimes\win-x64\native\avx2\llama.dll"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required native file missing: $file"
            }
            Write-Host "FOUND $file"
          }

      - name: Run native DLL smoke test
        shell: pwsh
        run: |
          Push-Location publish
          $process = Start-Process -FilePath ".\LiveTranslator.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          $code = $process.ExitCode

          if (Test-Path ".\smoke-report.txt") {
            Get-Content ".\smoke-report.txt"
          } else {
            Pop-Location
            throw "Smoke test produced no report. Exit code: $code"
          }

          Pop-Location

          if ($code -ne 0) {
            throw "Native smoke test failed with exit code $code"
          }

      - name: Run WinForms UI smoke test
        shell: pwsh
        run: |
          Push-Location publish
          $process = Start-Process -FilePath ".\LiveTranslator.exe" -ArgumentList "--ui-smoke-test" -Wait -PassThru
          $code = $process.ExitCode

          if (Test-Path ".\ui-smoke-report.txt") {
            Get-Content ".\ui-smoke-report.txt"
          } else {
            Pop-Location
            throw "UI smoke test produced no report. Exit code: $code"
          }

          Pop-Location

          if ($code -ne 0) {
            throw "UI smoke test failed with exit code $code"
          }

      - name: Verify model download URLs without downloading models
        shell: pwsh
        run: |
          $urls = @(
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin?download=true",
            "https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true"
          )

          foreach ($url in $urls) {
            Write-Host "Checking $url"
            curl.exe -L --fail --silent --show-error --head $url | Select-Object -Last 20
            if ($LASTEXITCODE -ne 0) {
              throw "Model URL check failed: $url"
            }
          }

      - name: Cache cloud-test models
        uses: actions/cache@v4
        with:
          path: .ci-models
          key: livetranslator-local-models-v1

      - name: Run full Whisper + Qwen model test
        shell: pwsh
        timeout-minutes: 25
        run: |
          Push-Location publish
          $process = Start-Process -FilePath ".\LiveTranslator.exe" -ArgumentList "--engine-smoke-test" -Wait -PassThru
          $code = $process.ExitCode

          if (Test-Path ".\engine-smoke-report.txt") {
            Get-Content ".\engine-smoke-report.txt"
          } else {
            Pop-Location
            throw "Full engine test produced no report. Exit code: $code"
          }

          Pop-Location

          if ($code -ne 0) {
            throw "Full engine test failed with exit code $code"
          }

      - name: Remove smoke-test reports from release folder
        shell: pwsh
        run: |
          Remove-Item publish\smoke-report.txt -ErrorAction SilentlyContinue
          Remove-Item publish\ui-smoke-report.txt -ErrorAction SilentlyContinue
          Remove-Item publish\engine-smoke-report.txt -ErrorAction SilentlyContinue

      - name: Upload only after all tests pass
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslator-Verified-LocalAI-Portable
          path: publish/**
          if-no-files-found: error
